name: Trenowanie modelu frekwencji

on:
  workflow_dispatch: {}

concurrency:
  group: basen-train
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install -r requirements-model.txt

      - name: Wytrenuj model
        run: python train_model.py

      - name: Wygeneruj tabelę predykcji dla dashboardu
        run: python generate_predictions.py

      - name: Zapisz model w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_frekwencji.pkl model_info.json data/predictions.json

          if git diff --cached --quiet; then
            echo "Brak zmian w modelu"
            exit 0
          fi

          git commit -m "Aktualizacja modelu: $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Zapisano pomyślnie (próba $i)"
              exit 0
            fi
            echo "Próba $i nieudana, ponawiam za 5s..."
            sleep 5
          done

          echo "Nie udało się wypchnąć zmian po kilku próbach" >&2
          exit 1
